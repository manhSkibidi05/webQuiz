<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f7fb">
    <title>QUIZ - Đăng nhập</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f6f7fb;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border: 1px solid #e9eaf1;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 18px 50px rgb(34 38 66 / 6%);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            color: #20243a;
            font-size: 28px;
            font-weight: 750;
            letter-spacing: -0.04em;
        }

        .brand-mark {
            display: grid;
            width: 32px;
            height: 32px;
            place-items: center;
            border-radius: 10px;
            background: #635bff;
            color: white;
            font-size: 15px;
        }

        .subtitle {
            text-align: center;
            color: #85899c;
            font-size: 14px;
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #20243a;
            font-size: 23px;
            letter-spacing: -0.03em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 650;
            color: #454a60;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #e7e8ef;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            color: #20243a;
            background: #fff;
            transition: border-color 150ms ease;
        }

        input:focus {
            border-color: #635bff;
        }

        input::placeholder {
            color: #a3a6b5;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #635bff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .forgot-password {
            text-align: right;
            margin-top: 10px;
        }

        .forgot-password a,
        .register a {
            color: #635bff;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot-password a:hover,
        .register a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            min-height: 46px;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #635bff;
            color: white;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
            transition: background 150ms ease;
        }

        .login-btn:hover {
            background: #5149e8;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #85899c;
            font-size: 13px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Logo thương hiệu -->
        <div class="logo">
            <span class="brand-mark" aria-hidden="true">Q</span>
            <span>quiz.</span>
        </div>

        <p class="subtitle">
            Nền tảng học tập và trắc nghiệm trực tuyến
        </p>

        <h2>Đăng nhập</h2>

        <!-- Form đăng nhập -->
        <form id="loginForm">

            <div class="form-group">
                <label for="username">Tên đăng nhập</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Nhập tên đăng nhập"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Nhập mật khẩu"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                    >
                        Hiện
                    </button>
                </div>

                <div class="forgot-password">
                    <a href="#">Quên mật khẩu?</a>
                </div>
            </div>

            <button type="submit" class="login-btn">
                Đăng nhập
            </button>

            <p id="message"></p>

        </form>

        <div class="register">
            Chưa có tài khoản?
            <a href="#">Đăng ký ngay</a>
        </div>

    </div>

    <script>
        // Hiện hoặc ẩn mật khẩu
        function togglePassword() {
            const password = document.getElementById("password");
            const button = document.querySelector(".toggle-password");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Ẩn";
            } else {
                password.type = "password";
                button.textContent = "Hiện";
            }
        }

        // Xử lý form đăng nhập
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            if (username && password) {
                message.style.color = "#16a34a";
                message.textContent = "Đã nhập đầy đủ thông tin!";
            }
        });
    </script>

</body>
</html>
