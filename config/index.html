<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f7fb">
    <title>Quiz — Kiểm tra kiến thức</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #20243a;
            background: #f6f7fb;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
        }

        button {
            font: inherit;
        }

        .page {
            width: min(100% - 40px, 760px);
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 88px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #20243a;
            font-size: 17px;
            font-weight: 750;
            letter-spacing: -0.04em;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 32px;
            height: 32px;
            place-items: center;
            border-radius: 10px;
            background: #635bff;
            color: white;
            font-size: 15px;
        }

        .topbar-label {
            color: #85899c;
            font-size: 13px;
        }

        main {
            padding: 46px 0 72px;
        }

        .intro {
            margin-bottom: 30px;
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #635bff;
            font-size: 12px;
            font-weight: 750;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 38px);
            letter-spacing: -0.055em;
        }

        .intro-copy {
            margin: 10px 0 0;
            color: #85899c;
            font-size: 15px;
        }

        .quiz-card {
            padding: clamp(24px, 6vw, 40px);
            border: 1px solid #e9eaf1;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 18px 50px rgb(34 38 66 / 6%);
        }

        .quiz-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
            color: #85899c;
            font-size: 13px;
        }

        .quiz-meta strong {
            color: #555a70;
            font-weight: 650;
        }

        .progress-track {
            height: 6px;
            overflow: hidden;
            border-radius: 99px;
            background: #eff0f6;
        }

        .progress-value {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: #635bff;
            transition: width 180ms ease;
        }

        .question {
            margin: 30px 0 22px;
            font-size: clamp(19px, 3vw, 23px);
            line-height: 1.45;
            letter-spacing: -0.025em;
        }

        .answers {
            display: grid;
            gap: 11px;
        }

        .answer {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 14px;
            min-height: 58px;
            padding: 12px 16px;
            border: 1px solid #e7e8ef;
            border-radius: 12px;
            background: #fff;
            color: #454a60;
            cursor: pointer;
            text-align: left;
            transition: border-color 150ms ease, background 150ms ease, color 150ms ease;
        }

        .answer:hover:not(:disabled) {
            border-color: #b6b2ff;
            background: #fafaff;
        }

        .answer:focus-visible,
        .next-button:focus-visible,
        .restart-button:focus-visible {
            outline: 3px solid rgb(99 91 255 / 28%);
            outline-offset: 3px;
        }

        .answer-letter {
            display: grid;
            width: 30px;
            height: 30px;
            flex: 0 0 30px;
            place-items: center;
            border: 1px solid #e7e8ef;
            border-radius: 8px;
            color: #85899c;
            font-size: 12px;
            font-weight: 700;
        }

        .answer.selected {
            border-color: #635bff;
            background: #f6f5ff;
            color: #423bce;
        }

        .answer.selected .answer-letter {
            border-color: #635bff;
            background: #635bff;
            color: #fff;
        }

        .answer:disabled {
            cursor: default;
        }

        .quiz-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 28px;
        }

        .hint {
            margin: 0;
            color: #9a9daf;
            font-size: 12px;
        }

        .next-button,
        .restart-button {
            min-height: 46px;
            padding: 0 20px;
            border: 0;
            border-radius: 10px;
            background: #635bff;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 650;
            transition: background 150ms ease, transform 150ms ease;
        }

        .next-button:hover:not(:disabled),
        .restart-button:hover {
            transform: translateY(-1px);
            background: #5149e8;
        }

        .next-button:disabled {
            background: #d7d6ef;
            cursor: not-allowed;
        }

        .result {
            padding: 24px 0 10px;
            text-align: center;
        }

        .result-icon {
            display: grid;
            width: 60px;
            height: 60px;
            margin: 0 auto 18px;
            place-items: center;
            border-radius: 18px;
            background: #f0efff;
            color: #635bff;
            font-size: 26px;
        }

        .result h2 {
            margin: 0;
            font-size: 25px;
            letter-spacing: -0.04em;
        }

        .result p {
            margin: 10px 0 24px;
            color: #85899c;
            font-size: 15px;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 520px) {
            .page {
                width: min(100% - 28px, 760px);
            }

            .topbar {
                min-height: 72px;
            }

            main {
                padding-top: 32px;
            }

            .quiz-footer {
                align-items: stretch;
                flex-direction: column-reverse;
            }

            .next-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="topbar">
            <a class="brand" href="#" aria-label="Quiz - trang chủ">
                <span class="brand-mark" aria-hidden="true">Q</span>
                <span>quiz.</span>
            </a>
            <span class="topbar-label">Học một chút mỗi ngày</span>
        </header>

        <main>
            <section class="intro" aria-labelledby="page-title">
                <p class="eyebrow">Quiz nhanh</p>
                <h1 id="page-title">Thử thách kiến thức</h1>
                <p class="intro-copy">Chọn đáp án đúng và xem bạn đạt được bao nhiêu điểm.</p>
            </section>

            <section class="quiz-card" aria-label="Bài quiz">
                <div id="quiz-content">
                    <div class="quiz-meta">
                        <span id="question-count">Câu 1 / 4</span>
                        <strong>Kiến thức tổng hợp</strong>
                    </div>
                    <div
                        class="progress-track"
                        role="progressbar"
                        aria-label="Tiến độ bài quiz"
                        aria-valuemin="0"
                        aria-valuemax="4"
                        aria-valuenow="1"
                    >
                        <div class="progress-value" id="progress-value"></div>
                    </div>

                    <h2 class="question" id="question-text"></h2>
                    <div class="answers" id="answers" aria-label="Các đáp án"></div>

                    <div class="quiz-footer">
                        <p class="hint" id="hint">Chọn một đáp án để tiếp tục</p>
                        <button class="next-button" id="next-button" type="button" disabled>
                            Câu tiếp theo
                        </button>
                    </div>
                </div>

                <div class="result" id="result" aria-live="polite" hidden>
                    <div class="result-icon" aria-hidden="true">✓</div>
                    <h2 id="result-title">Hoàn thành!</h2>
                    <p id="result-copy"></p>
                    <button class="restart-button" id="restart-button" type="button">Làm lại</button>
                </div>
            </section>
        </main>
    </div>

    <script>
        const questions = [
            {
                text: "Hành tinh nào được biết đến với tên gọi “hành tinh đỏ”?",
                answers: ["Sao Kim", "Sao Hỏa", "Sao Mộc", "Sao Thủy"],
                correct: 1
            },
            {
                text: "Đại dương nào lớn nhất trên Trái Đất?",
                answers: ["Đại Tây Dương", "Ấn Độ Dương", "Thái Bình Dương", "Bắc Băng Dương"],
                correct: 2
            },
            {
                text: "Ngôn ngữ nào được trình duyệt sử dụng để tạo tương tác trên trang web?",
                answers: ["JavaScript", "SQL", "Python", "C++"],
                correct: 0
            },
            {
                text: "Một năm nhuận có bao nhiêu ngày?",
                answers: ["364 ngày", "365 ngày", "366 ngày", "367 ngày"],
                correct: 2
            }
        ];

        const questionCount = document.getElementById("question-count");
        const progress = document.getElementById("progress-value");
        const progressTrack = document.querySelector(".progress-track");
        const questionText = document.getElementById("question-text");
        const answersContainer = document.getElementById("answers");
        const nextButton = document.getElementById("next-button");
        const hint = document.getElementById("hint");
        const quizContent = document.getElementById("quiz-content");
        const result = document.getElementById("result");
        const resultTitle = document.getElementById("result-title");
        const resultCopy = document.getElementById("result-copy");
        const restartButton = document.getElementById("restart-button");

        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = null;

        function renderQuestion() {
            const question = questions[currentQuestion];
            questionCount.textContent = `Câu ${currentQuestion + 1} / ${questions.length}`;
            progress.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            progressTrack.setAttribute("aria-valuemax", questions.length);
            progressTrack.setAttribute("aria-valuenow", currentQuestion + 1);
            questionText.textContent = question.text;
            answersContainer.replaceChildren();
            selectedAnswer = null;
            nextButton.disabled = true;
            hint.textContent = "Chọn một đáp án để tiếp tục";
            nextButton.textContent = currentQuestion === questions.length - 1
                ? "Xem kết quả"
                : "Câu tiếp theo";

            question.answers.forEach((answer, index) => {
                const button = document.createElement("button");
                button.className = "answer";
                button.type = "button";
                button.setAttribute("aria-pressed", "false");

                const letter = document.createElement("span");
                letter.className = "answer-letter";
                letter.setAttribute("aria-hidden", "true");
                letter.textContent = String.fromCharCode(65 + index);

                const label = document.createElement("span");
                label.textContent = answer;
                button.append(letter, label);
                button.addEventListener("click", () => selectAnswer(index, button));
                answersContainer.append(button);
            });
        }

        function selectAnswer(index, selectedButton) {
            if (selectedAnswer !== null) return;

            selectedAnswer = index;
            const isCorrect = index === questions[currentQuestion].correct;
            if (isCorrect) score += 1;

            answersContainer.querySelectorAll(".answer").forEach((button, answerIndex) => {
                button.disabled = true;
                button.setAttribute("aria-pressed", String(answerIndex === index));
            });
            selectedButton.classList.add("selected");
            hint.textContent = isCorrect ? "Chính xác! Đáp án đúng." : "Đã ghi nhận câu trả lời.";
            nextButton.disabled = false;
        }

        function showResult() {
            quizContent.hidden = true;
            result.hidden = false;
            resultTitle.textContent = score === questions.length ? "Xuất sắc!" : "Hoàn thành!";
            resultCopy.textContent = `Bạn trả lời đúng ${score}/${questions.length} câu.`;
        }

        nextButton.addEventListener("click", () => {
            if (selectedAnswer === null) return;
            currentQuestion += 1;

            if (currentQuestion === questions.length) {
                showResult();
                return;
            }

            renderQuestion();
        });

        restartButton.addEventListener("click", () => {
            currentQuestion = 0;
            score = 0;
            result.hidden = true;
            quizContent.hidden = false;
            renderQuestion();
        });

        renderQuestion();
    </script>
</body>
</html>
