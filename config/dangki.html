<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - EduPath</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
        }

        .container {
            padding: 30px 15px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #2563eb;
            font-size: 35px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #64748b;
            font-size: 14px;
        }

        .form-box {
            width: 450px;
            max-width: 100%;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .form-box h2 {
            text-align: center;
            color: #1e40af;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            height: 42px;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #2563eb;
        }

        .agree {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .agree input {
            width: 16px;
            height: 16px;
        }

        button {
            width: 100%;
            height: 45px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 13px;
        }

        @media screen and (max-width: 480px) {
            .form-box {
                padding: 20px;
            }

            .logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            <h1>EduPath</h1>
            <p>HỆ THỐNG HỌC VÀ THI TRỰC TUYẾN</p>
        </div>

        <div class="form-box">

            <h2>Đăng ký tài khoản</h2>

            <p class="description">
                Tạo tài khoản để bắt đầu học tập và kiểm tra trực tuyến
            </p>

            <form id="registerForm">

                <div class="input-group">
                    <label>Họ và tên</label>
                    <input type="text" id="hoten"
                           placeholder="Nhập họ và tên" required>
                </div>

                <div class="input-group">
                    <label>Mã sinh viên</label>
                    <input type="text" id="masv"
                           placeholder="Nhập mã sinh viên" required>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email"
                           placeholder="Nhập email" required>
                </div>

                <div class="input-group">
                    <label>Số điện thoại</label>
                    <input type="tel" id="sdt"
                           placeholder="Nhập số điện thoại" required>
                </div>

                <div class="input-group">
                    <label>Ngành học</label>
                    <select id="nganhhoc" required>
                        <option value="">-- Chọn ngành học --</option>
                        <option value="CNTT">Công nghệ thông tin</option>
                        <option value="THKT">Tin học kinh tế</option>
                        <option value="DT">Công nghệ địa tin học</option>
                        <option value="KT">Kinh tế</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="username"
                           placeholder="Nhập tên đăng nhập" required>
                </div>

                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password"
                           placeholder="Nhập mật khẩu"
                           minlength="6" required>
                </div>

                <div class="input-group">
                    <label>Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword"
                           placeholder="Nhập lại mật khẩu" required>
                </div>

                <div class="agree">
                    <input type="checkbox" id="agree" required>
                    <label for="agree">
                        Tôi đồng ý với điều khoản sử dụng
                    </label>
                </div>

                <button type="submit">Đăng ký tài khoản</button>

                <p class="message" id="message"></p>

            </form>

            <div class="login">
                Đã có tài khoản?
                <a href="#">Đăng nhập</a>
            </div>

        </div>

        <div class="footer">
            © 2026 EduPath - Hệ thống học và thi trực tuyến
        </div>

    </div>

    <script>
        // Lấy form đăng ký
        let form = document.getElementById("registerForm");

        // Xử lý sự kiện đăng ký
        form.addEventListener("submit", function(event) {

            event.preventDefault();

            // Lấy thông tin người dùng
            let hoten = document.getElementById("hoten").value;
            let masv = document.getElementById("masv").value;
            let email = document.getElementById("email").value;
            let sdt = document.getElementById("sdt").value;
            let nganhhoc = document.getElementById("nganhhoc").value;
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;

            let message = document.getElementById("message");

            // Kiểm tra mật khẩu
            if (password.length < 6) {
                message.style.color = "red";
                message.innerHTML = "Mật khẩu phải có ít nhất 6 ký tự!";
                return;
            }

            // Kiểm tra xác nhận mật khẩu
            if (password !== confirmPassword) {
                message.style.color = "red";
                message.innerHTML = "Mật khẩu xác nhận không khớp!";
                return;
            }

            // Thông báo đăng ký
            message.style.color = "green";
            message.innerHTML = "Đăng ký thành công! Chào mừng " + hoten;

            // Hiển thị thông tin trong Console
            console.log("Họ tên: " + hoten);
            console.log("Mã sinh viên: " + masv);
            console.log("Email: " + email);
            console.log("Số điện thoại: " + sdt);
            console.log("Ngành học: " + nganhhoc);
            console.log("Tên đăng nhập: " + username);

        });
    </script>

</body>
</html>
